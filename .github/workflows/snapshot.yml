name: Deploy SNAPSHOT to Central

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify version is a SNAPSHOT
        run: |
          VERSION=$(./mvnw -B -ntp -q -pl . -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec 2>/dev/null || mvn -B -ntp -q -pl . -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)
          echo "Detected version: $VERSION"
          case "$VERSION" in
            *-SNAPSHOT) echo "OK";;
            *) echo "Refusing to publish non-SNAPSHOT version from main: $VERSION"; exit 1;;
          esac

      - name: Deploy SNAPSHOT
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        # Central answers 429 when a runner's shared IP sends too many requests, and Maven's default retries (5, 10
        # and 15 seconds) give up after about 30 seconds. The deferred upload sends one file at a time, so a retry
        # pauses the whole upload: wait 10, 20, ... 100 seconds instead, and honour a Retry-After of up to 10 minutes.
        # Maven 3.9 (Resolver 1.9) reads aether.connector.http.*; Maven 3.10 and 4 (Resolver 2) read aether.transport.http.*.
        run: >-
          mvn -Prelease clean deploy -DskipTests -Dmaven.repository.credentialScope=id
          -Daether.connector.http.retryHandler.count=10
          -Daether.connector.http.retryHandler.interval=10000
          -Daether.connector.http.retryHandler.intervalMax=600000
          -Daether.transport.http.retryHandler.count=10
          -Daether.transport.http.retryHandler.interval=10000
          -Daether.transport.http.retryHandler.intervalMax=600000
