// Applies the Codiqo Gradle plugin to a target build WITHOUT editing its build files, and
// force-applies the jacoco plugin to every java project. Codiqo OWNS coverage in the analysis
// build: the plugin normalizes every Test task's jacoco extension (enabled + uniform per-module
// exec file) at task-graph-ready, so the target project's own jacoco configuration — absent,
// customized destinationFile, or disabled tasks — never affects what the analysis reads.
//
// Codiqo also owns test execution: every Test task is capped with the same envelope the Maven fork imposes
// (task timeout + JUnit per-test timeout in SEPARATE_THREAD mode) and has ignoreFailures set, so a red test
// cannot abort the build before codiqoDumpAnalysis runs. --continue is required for the same reason: a test
// task that hits its TIMEOUT still fails, and only --continue carries the build through to the dump.
//
// Usage (from the target project, e.g. a spring-kafka checkout):
//   ./gradlew --init-script /path/to/codiqo.init.gradle --continue \
//       test codiqoDumpAnalysis \
//       -Pcodiqo.commitId=<sha> -Pcodiqo.outputDirectory=/path/to/reports
//
// Requires `mvn install` to have published io.codiqo:* to the local Maven repo first.

initscript {
    repositories {
        mavenLocal()
        mavenCentral()
    }
    dependencies {
        classpath 'io.codiqo:codiqo-gradle-plugin:1.0-SNAPSHOT'
    }
}

rootProject {
    apply plugin: io.codiqo.gradle.CodiqoGradlePlugin
}

allprojects { project ->
    project.pluginManager.withPlugin('java') {
        project.pluginManager.apply('jacoco')
    }
}
